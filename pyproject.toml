[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rivalsdata-api"
version = "0.2.0"
description = "Unofficial Python client for public RivalsData data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["curl-cffi>=0.7"]

[project.optional-dependencies]
browser = ["camoufox>=0.5.6"]
mcp = ["mcp>=1.12,<2", "mcp-ui-server>=1.0.0"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.11"]

[project.scripts]
rivalsdata-mcp = "rivalsdata.mcp_server:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = ["PYI034"]

[tool.hatch.build.targets.wheel]
packages = ["src/rivalsdata"]
