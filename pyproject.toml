[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rivals-api"
version = "4.1.0"
description = "Multi-source Python client and MCP server for Marvel Rivals player stats"
keywords = ["marvel-rivals", "multi-source", "game-stats", "tracker", "mcp"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["curl-cffi>=0.7"]

[project.urls]
Homepage = "https://github.com/GS-Rionnag/rivals-api"
Repository = "https://github.com/GS-Rionnag/rivals-api"
Issues = "https://github.com/GS-Rionnag/rivals-api/issues"
Changelog = "https://github.com/GS-Rionnag/rivals-api/releases"

[project.optional-dependencies]
browser = ["camoufox>=0.5.6"]
mcp = ["mcp>=1.12,<2", "mcp-ui-server>=1.0.0", "uvicorn>=0.30"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = ["PYI034"]

[tool.hatch.build.targets.wheel]
packages = ["src/rivals_api", "src/rivalsdata"]
